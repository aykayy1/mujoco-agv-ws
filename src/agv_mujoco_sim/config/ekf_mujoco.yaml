ekf_filter_node:
  ros__parameters:
    use_sim_time: true

    # EKF output rate used on both simulation and the real robot.
    frequency: 35.0
    sensor_timeout: 0.10
    two_d_mode: true

    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_foot_link
    world_frame: odom

    # Encoder-style odometry do bridge tích phân từ qpos hai bánh.
    # Thứ tự 15 biến:
    # x, y, z, roll, pitch, yaw,
    # vx, vy, vz, vroll, vpitch, vyaw,
    # ax, ay, az
    odom0: /wheel/odom
    odom0_config:
      [false, false, false,
       false, false, false,
       true,  true,  false,
       false, false, true,
       false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false
    odom0_twist_rejection_threshold: 5.0

    # Giai đoạn đầu chỉ fuse gyro Z. Chưa fuse orientation và acceleration
    # cho đến khi xác minh convention, bias và covariance của IMU thật.
    imu0: /imu
    imu0_config:
      [false, false, false,
       false, false, false,
       false, false, false,
       false, false, true,
       false, false, false]
    imu0_queue_size: 20
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_angular_velocity_rejection_threshold: 5.0
